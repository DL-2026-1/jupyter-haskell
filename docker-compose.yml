version: '3.8'

services:
  jupyter:
    image: ghcr.io/dl-2026-1/jupyter-haskell:latest
    build: .  
    container_name: ihaskell_server
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: start-notebook.sh --ServerApp.token=''